  <meta charset="UTF-8">

  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      padding: 40px 20px 60px;
      color: #fff;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, #f0c040, #ffffff, #a0d8ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    header p {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.06em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 28px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px 16px 20px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-6px) scale(1.03);
      background: rgba(255, 255, 255, 0.14);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(160, 216, 239, 0.2);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .card:active {
      transform: translateY(-2px) scale(1.01);
    }

    .icon-wrap {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      flex-shrink: 0;
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-label {
      font-size: 0.88rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.45;
      letter-spacing: 0.04em;
      color: rgba(255,255,255,0.92);
    }

    .card-badge {
      margin-top: 8px;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .badge-claude {
      background: rgba(210, 140, 80, 0.25);
      color: #f0b97a;
      border: 1px solid rgba(210, 140, 80, 0.4);
    }

    .badge-gpt {
      background: rgba(16, 163, 127, 0.2);
      color: #5ce0b8;
      border: 1px solid rgba(16, 163, 127, 0.35);
    }

    .badge-gemini {
      background: rgba(66, 133, 244, 0.2);
      color: #7ab8ff;
      border: 1px solid rgba(66, 133, 244, 0.35);
    }

    footer {
      text-align: center;
      margin-top: 56px;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      header h1 { font-size: 1.6rem; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
      .icon-wrap { width: 88px; height: 88px; }
      .card-label { font-size: 0.8rem; }
    }
  </style>
</head>
